## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Wed Feb 02 13:50:55 IST 2022
org.gradle.jvmargs=-Xmx4096M \
  -Dkotlin.daemon.jvm.options\="-Xmx4096M" \
  -XX:+HeapDumpOnOutOfMemoryError \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/java.util=ALL-UNNAMED \
  --add-opens java.base/java.io=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
# WARNING: ignorelist likely expects artifact coordinates (e.g., group:artifact), not a bare JAR name.
android.jetifier.ignorelist=common-30.2.2.jar

# TODO : Migrate
android.nonTransitiveRClass=false

# SECURITY: Removed deprecated TLSv1 and TLSv1.1. Only TLSv1.2+ allowed.
systemProp.https.protocols=TLSv1.2,TLSv1.3

org.gradle.caching=true
# org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true

# Pinning a specific R8 version may cause incompatibility with the AGP version.
# Uncomment only if necessary and ensure the version matches your AGP's bundled R8.
# android.r8.version=8.6.17
