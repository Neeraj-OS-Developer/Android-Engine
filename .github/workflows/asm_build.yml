name: Build Optimized Android APK

on:
  push:
    branches: [ "dev", "main", "indexing", "release/**" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

jobs:
  build:
    name: Build with JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set signing environment variables
        run: |
          echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD:-123456}" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-123456}" >> $GITHUB_ENV
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create optimized gradle.properties (if missing)
        run: |
          if [ ! -f gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" > gradle.properties
            echo "org.gradle.parallel=true" >> gradle.properties
            echo "org.gradle.caching=true" >> gradle.properties
            echo "org.gradle.configuration-cache=false" >> gradle.properties
            echo "android.enableR8.fullMode=true" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
          else
            grep -q "org.gradle.parallel" gradle.properties || echo "org.gradle.parallel=true" >> gradle.properties
            grep -q "org.gradle.caching" gradle.properties || echo "org.gradle.caching=true" >> gradle.properties
            grep -q "android.enableR8.fullMode" gradle.properties || echo "android.enableR8.fullMode=true" >> gradle.properties
            grep -q "org.gradle.configuration-cache" gradle.properties || echo "org.gradle.configuration-cache=false" >> gradle.properties
          fi

      - name: Show build environment
        run: |
          echo "=== Java version ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Assemble release APK
        run: ./gradlew :core:app:assembleRelease --no-daemon --stacktrace

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release-jdk${{ matrix.java }}
          path: core/app/build/outputs/apk/release/*arm64-v8a*.apk
        if: always()

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-release-jdk${{ matrix.java }}
          path: core/app/build/outputs/apk/release/*armeabi-v7a*.apk
        if: always()
