name: Build Optimized Android APK

on:
  push:
    branches: [ "dev", "main", "indexing", "release/**" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # Cancel previous runs on the same branch to save resources
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      # Checkout with submodules and full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # Set up JDK 17 as the baseline to run Gradle.
      # Gradle toolchains (if configured in your project) will automatically
      # download any other required JDK (e.g., 11, 21) for compilation.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Setup Gradle with built-in caching & wrapper validation
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper   # uses your project's gradle wrapper
          cache-read-only: false
          # Enables configuration cache for faster builds
          add-job-summary-as-pr-comment: on-failure

      # Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Create local.properties for signing (adjust values as needed)
      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=123456" >> local.properties  
          echo "signing.keyAlias=AndroidCS" >> local.properties
          echo "signing.keyPassword=123456" >> local.properties

      # If the project doesn't already have a gradle.properties with optimisations,
      # create one automatically. You can also commit this file to your repo.
      - name: Ensure optimized gradle.properties
        run: |
          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<EOF
            org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
            org.gradle.parallel=true
            org.gradle.caching=true
            org.gradle.configuration-cache=true
            android.enableR8.fullMode=true
            android.useAndroidX=true
            EOF
          else
            # If file exists, ensure R8 full mode is enabled (add if missing)
            if ! grep -q "android.enableR8.fullMode" gradle.properties; then
              echo "android.enableR8.fullMode=true" >> gradle.properties
            fi
          fi

      # Optional: show project versions for debugging
      - name: Show project info
        run: |
          echo "=== Java version (baseline) ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== Kotlin version (from project) ==="
          ./gradlew -q printKotlinVersion || true

      # Build the release APK (adjust module path if needed)
      - name: Assemble release APK
        run: ./gradlew :core:app:assembleRelease --no-daemon --stacktrace

      # Upload all ABI splits as separate artefacts
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/release/*arm64-v8a*.apk
        if: always()

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-release
          path: core/app/build/outputs/apk/release/*armeabi-v7a*.apk
        if: always()

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-release
          path: core/app/build/outputs/apk/release/*x86_64*.apk
        if: always()

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-release
          path: core/app/build/outputs/apk/release/*universal*.apk
        if: always()
